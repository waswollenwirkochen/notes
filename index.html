<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HeadSpace">
<title>HeadSpace · Notizbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --panel:rgba(17,19,42,.62); --panel2:rgba(28,30,62,.7); --line:rgba(170,175,255,.13); --line2:rgba(170,175,255,.24);
  --text:#ecebfa; --muted:#9396bd; --dim:#62658c;
  --violet:#a594ff; --teal:#62e6d8; --star:#ffd57e; --danger:#ff7a8a;
  --r:18px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --head:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--text);font:16px/1.5 var(--body)}
body{background:transparent}
body{overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--teal)}
[hidden]{display:none!important}
svg{width:20px;height:20px;flex:none}
::selection{background:rgba(165,148,255,.35)}

/* ---------- Himmel ---------- */
#sky{position:fixed;inset:0;z-index:-2;pointer-events:none}
.nebula{position:fixed;inset:-20%;z-index:-3;pointer-events:none;
  background:
   radial-gradient(40% 35% at 18% 12%,rgba(112,76,255,.22),transparent 70%),
   radial-gradient(35% 30% at 88% 28%,rgba(214,76,180,.14),transparent 70%),
   radial-gradient(45% 40% at 70% 95%,rgba(40,170,190,.14),transparent 70%),
   radial-gradient(60% 50% at 30% 80%,rgba(60,40,140,.18),transparent 70%),
   var(--bg);
  animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.nebula{animation:none}}

/* ---------- Zugang ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:32px 26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.gate-card .logo{width:64px;height:64px;margin:0 auto 10px;display:block}
.gate-card h1{font:700 26px var(--head);text-align:center;margin:0;letter-spacing:.02em}
.gate-card .sub{text-align:center;color:var(--muted);margin:4px 0 22px;font-size:14px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.field small{display:block;font-size:12px;color:var(--dim);margin:6px 4px 0}
.inp{width:100%;background:rgba(5,6,20,.55);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(165,148,255,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;min-height:1.2em;margin:10px 0 0;text-align:center}
.info{color:var(--star);font-size:14px;margin:0 0 14px;text-align:center}
.linkbtn{display:block;margin:14px auto 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;font-size:15px;white-space:nowrap;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{background:rgba(255,255,255,.07)}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:transparent;background:linear-gradient(135deg,#7b66ff,#4fc9d9);color:#070816;box-shadow:0 6px 24px rgba(120,100,255,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:rgba(255,122,138,.4);color:var(--danger)}
.btn.block{width:100%;justify-content:center;padding:13px}
.ico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--muted);transition:background .2s,color .2s}
.ico:hover{background:rgba(255,255,255,.06);color:var(--text)}
.ico.on{color:var(--star)}
.ico.on svg{fill:var(--star)}
.ico.danger:hover{color:var(--danger)}

/* ---------- Kopf & Navigation ---------- */
#app{min-height:100dvh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:calc(12px + var(--safe-t)) 20px 12px;background:linear-gradient(to bottom,rgba(4,5,13,.92),rgba(4,5,13,.6) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default;touch-action:manipulation;font:700 18px var(--head);letter-spacing:.03em}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:4px;margin:0 auto;padding:5px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;transition:color .2s,background .25s}
.tab:hover{color:var(--text)}
.tab.on{color:#0a0b1c;background:linear-gradient(135deg,#b3a6ff,#79e9de);box-shadow:0 4px 18px rgba(140,120,255,.35)}
.tab .badge{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);color:inherit}
.tab.on .badge{background:rgba(10,11,28,.18)}
.top-actions{display:flex;align-items:center;gap:4px}
.sync{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.sync:hover{background:rgba(255,255,255,.05)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.sync[data-s=ok] .dot{background:var(--teal);box-shadow:0 0 10px var(--teal)}
.sync[data-s=busy] .dot,.sync[data-s=pending] .dot{background:var(--star);animation:pulse 1s ease-in-out infinite}
.sync[data-s=err] .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}

main{max-width:1120px;margin:0 auto;padding:8px 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 18px}
.toolbar .grow{flex:1}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.search svg{color:var(--dim)}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0;font-size:16px}
.muted{color:var(--muted)}
.usage{color:var(--muted);font-size:14px;margin-left:auto}

/* ---------- Panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel-h{display:flex;align-items:baseline;gap:10px;padding:18px 20px 6px}
.panel-h h2{font:600 17px var(--head);margin:0;letter-spacing:.02em}
.panel-h .count{color:var(--muted);font-size:14px}
.panel-h .hint{margin-left:auto;color:var(--dim);font-size:12px}

/* ---------- To-dos ---------- */
.todo-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.add-todo{display:flex;gap:8px;margin:8px 14px 6px;padding:4px 4px 4px 14px;border-radius:14px;background:rgba(5,6,20,.45);border:1px solid var(--line)}
.add-todo:focus-within{border-color:var(--violet)}
.add-todo input{flex:1;background:none;border:0;outline:0;padding:8px 0;font-size:16px}
.add-todo button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(165,148,255,.16);color:var(--violet)}
.todos{list-style:none;margin:0;padding:4px 8px 10px}
.todo{display:flex;align-items:flex-start;gap:12px;padding:9px 8px;border-radius:12px;transition:background .2s}
.todo:hover{background:rgba(255,255,255,.035)}
.check{position:relative;flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--line2);transition:all .2s}
.check:hover{border-color:var(--violet)}
.check::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#fff6d8,var(--star));opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.is-done .check{border-color:var(--star);box-shadow:0 0 12px rgba(255,213,126,.45)}
.is-done .check::after{opacity:1;transform:scale(1)}
.todo .txt{flex:1;min-width:0;outline:0;overflow-wrap:anywhere;padding:1px 4px;border-radius:6px}
.todo .txt:focus{background:rgba(255,255,255,.06)}
.is-done .txt{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.todo .age{font-size:11px;color:var(--star);opacity:.75;white-space:nowrap;margin-top:4px}
.todo .acts{display:flex;gap:2px;opacity:.35;transition:opacity .2s}
.todo:hover .acts,.todo:focus-within .acts{opacity:1}
.mini{padding:4px 9px;border-radius:8px;font-size:12px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini.x{border:0;font-size:18px;line-height:1;padding:2px 7px}
.mini.x:hover{color:var(--danger)}
.empty{color:var(--dim);font-size:14px;padding:14px 12px;list-style:none}
.done-box{margin:0 8px 12px;border-top:1px solid var(--line)}
.done-box summary{cursor:pointer;color:var(--muted);font-size:14px;padding:12px 10px 6px;list-style:none}
.done-box summary::-webkit-details-marker{display:none}
.done-box summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
.done-box[open] summary::before{transform:rotate(90deg)}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 10px 8px}
.link:hover{color:var(--danger)}

/* ---------- Notizen ---------- */
.notes-grid{columns:4 240px;column-gap:16px}
.note{position:relative;break-inside:avoid;margin:0 0 16px;padding:16px 16px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s,border-color .2s,box-shadow .2s;outline:0}
.note::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--nc,transparent);box-shadow:0 0 14px var(--nc,transparent)}
.note:hover,.note:focus-visible{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.note h3{font:600 15px var(--head);margin:0 0 6px;padding-right:18px;letter-spacing:.01em;overflow-wrap:anywhere}
.note .prev{color:#c9c8e6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.note footer{color:var(--dim);font-size:12px;margin-top:10px}
.note .pin{position:absolute;top:12px;right:12px;color:var(--star)}
.note .pin svg{width:15px;height:15px;fill:var(--star)}
.sc-prev{display:flex;flex-direction:column;gap:3px;font-size:14px}
.sc-prev div{display:flex;justify-content:space-between;gap:10px}
.sc-prev b{font-variant-numeric:tabular-nums}
.sc-prev .lead{color:var(--star)}
.c-none{--nc:transparent}.c-mars{--nc:#ff7d5c}.c-saturn{--nc:#ffd57e}.c-venus{--nc:#ff8fd0}.c-uranus{--nc:#62e6d8}.c-neptun{--nc:#6f8dff}.c-nebula{--nc:#b28cff}
.big-empty{text-align:center;color:var(--muted);padding:60px 20px}
.big-empty .planet{width:90px;height:90px;margin:0 auto 14px;opacity:.85}

/* ---------- Medien ---------- */
.drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--muted);font-size:14px;margin-bottom:18px;transition:all .2s;text-align:center}
.drop.over{border-color:var(--teal);background:rgba(98,230,216,.07);color:var(--text)}
@media (hover:none){.drop{display:none}}
.uploads{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.up{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.up .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .st{color:var(--muted)}
.up.err .st{color:var(--danger)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.day-h{font:600 13px var(--head);color:var(--muted);letter-spacing:.04em;margin:18px 2px 10px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s,border-color .2s}
.tile:hover{border-color:var(--line2)}
.tile:active{transform:scale(.97)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ficon{font:600 13px var(--head);color:var(--muted);text-transform:uppercase;padding:6px;text-align:center;overflow-wrap:anywhere}
.tile .vb{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;border-radius:8px;background:rgba(0,0,0,.6);font-size:12px}
.tile .vb svg{width:12px;height:12px}
.tile .sel{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center}
.selecting .tile .sel{display:grid}
.tile.picked{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.tile.picked img{opacity:.7}
.tile.picked .sel{background:var(--teal);border-color:var(--teal);color:#05060f}
.tile.picked .sel svg{width:14px;height:14px}
.selbar{position:sticky;top:76px;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;margin-bottom:14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.selbar .grow{flex:1}

/* ---------- Overlay ---------- */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,3,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#overlay.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(760px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(24,26,56,.96),rgba(12,13,32,.97));border:1px solid var(--line2);border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;animation:rise .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(14px) scale(.98)}}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--nc,transparent);box-shadow:0 0 20px var(--nc,transparent)}
.ed-top{display:flex;align-items:center;gap:2px;padding:12px 10px 4px 20px}
.ed-title{flex:1;min-width:0;background:none;border:0;outline:0;font:600 20px var(--head);padding:8px 0}
.ed-title::placeholder,.ed-body::placeholder{color:var(--dim)}
.ed-body{flex:1;min-height:42vh;resize:none;background:none;border:0;outline:0;padding:8px 20px 16px;font-size:16px;line-height:1.65}
.ed-links{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px}
.ed-links:empty{display:none}
.ed-links a{display:inline-flex;max-width:100%;padding:5px 11px;border-radius:999px;background:rgba(98,230,216,.1);border:1px solid rgba(98,230,216,.25);font-size:13px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-foot{display:flex;align-items:center;gap:10px;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
.colors{display:flex;gap:6px}
.cdot{width:22px;height:22px;border-radius:50%;background:var(--nc);border:2px solid transparent;transition:transform .15s}
.cdot.c-none{background:transparent;border:2px dashed var(--line2)}
.cdot:hover{transform:scale(1.15)}
.cdot.on{border-color:#fff;box-shadow:0 0 10px var(--nc)}
.ed-stat{margin-left:auto;color:var(--dim);font-size:12px;text-align:right}
.score{padding:8px 16px 4px}
.player{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
.player .pname{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;font-weight:600;padding:6px 4px}
.player.lead .pname{color:var(--star)}
.pbtn{width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pbtn:active{transform:scale(.94);background:rgba(165,148,255,.2)}
.pbtn.plus{background:rgba(165,148,255,.16);color:var(--violet)}
.pscore{width:72px;text-align:center;background:none;border:0;outline:0;font:700 24px var(--head);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.pscore::-webkit-inner-spin-button{display:none}
.player .rm{color:var(--dim);font-size:18px;padding:6px}
.player .rm:hover{color:var(--danger)}
.score-acts{display:flex;gap:8px;padding:10px 0 4px}

.viewer{width:100%;height:100%;display:flex;flex-direction:column;gap:10px}
.v-top{display:flex;align-items:center;gap:10px;padding-top:var(--safe-t)}
.v-top .meta{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-top .meta b{color:var(--text);font-weight:600}
.v-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.6);object-fit:contain}
.v-stage .spin{width:34px;height:34px;border-width:3px}
.v-stage .file{text-align:center;color:var(--muted)}
.v-stage .file b{display:block;font:700 34px var(--head);color:var(--text);margin-bottom:8px;text-transform:uppercase}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);border:1px solid var(--line)}
.v-nav.l{left:0}.v-nav.r{right:0}
.v-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding-bottom:calc(4px + var(--safe-b))}

.sheet{width:min(520px,100%);padding:24px 22px}
.sheet h2{font:600 19px var(--head);margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.sheet .grp{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.sheet .grp p{margin:0;color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.sheet .close{position:absolute;top:12px;right:12px}

#toast{position:fixed;left:50%;width:max-content;bottom:calc(var(--nav-h) + 20px + var(--safe-b));transform:translateX(-50%) translateY(20px);z-index:60;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 18px;border-radius:999px;background:#1d1f45;border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--star);font-weight:700;padding:4px 8px}

/* ---------- Mobil ---------- */
@media (max-width:760px){
  .top{padding:calc(10px + var(--safe-t)) 14px 10px;backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(to bottom,rgba(4,5,13,.95),rgba(4,5,13,.75) 75%,transparent)}
  .sync .lbl{display:none}

/* Wiederholen / Chips */

/* Checklisten */

'use strict';
/* =====================================================================
   HeadSpace · persönliches, verschlüsseltes Notizbuch

const MAX_FILE = 50 * 1024 * 1024;
const DAY = 86400000;

/* ---------- Icons ---------- */

};
let _lg = 0;

const COLORS = ['none', 'nebula', 'neptun', 'uranus', 'saturn', 'mars', 'venus'];
const CNAME = { none: 'Keine Farbe', nebula: 'Nebel', neptun: 'Neptun', uranus: 'Uranus', saturn: 'Saturn', mars: 'Mars', venus: 'Venus' };
const TABS = [['todos', 'To-dos', I.todo], ['notes', 'Notizen', I.note], ['media', 'Frachtraum', I.media], ['sky', 'Stargazing', sv('<path d="M12 2.5l1.6 4.4 4.4 1.6-4.4 1.6L12 14.5l-1.6-4.4L6 8.5l4.4-1.6z"/><path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8zM5.5 15l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/>')], ['vault', 'Tresor', I.shield]];

/* ---------- Helfer ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = h => h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 20);
const alive = a => (a || []).filter(x => !x.deleted);
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' MB';
const fmtTime = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
function fmtDate(t) {
  const d0 = startOfDay();
  if (t >= d0) return 'heute, ' + fmtTime(t);
  if (t >= d0 - DAY) return 'gestern, ' + fmtTime(t);
  const d = new Date(t), y = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('de-DE', y ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
}
function dayLabel(t) {
  const d0 = startOfDay();
  if (t >= d0) return 'Heute';
  if (t >= d0 - DAY) return 'Gestern';
  return new Date(t).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function fmtDay(t) {
  const d0 = startOfDay();
  if (t === d0) return 'heute';
  if (t === addDays(d0, 1)) return 'morgen';
  return WD[new Date(t).getDay()] + ', ' + new Date(t).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' });
}
const fmtDur = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function b64(buf) { const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

/* ---------- Krypto ---------- */
async function deriveKey(pass, saltB64, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encBytes(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decBytes(key, bytes) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12)));
}
const encStr = async (key, s) => b64(await encBytes(key, enc.encode(s)));
const decStr = async (key, s) => dec.decode(await decBytes(key, unb64(s)));

/* ---------- IndexedDB (Schlüssel, Cache, geteilte Dateien) ---------- */
let _db;
function idb() {
  return _db || (_db = new Promise((res, rej) => {
    const r = indexedDB.open('kosmos-notes', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('shared', { autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function store(name, mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(name, mode); const r = fn(tx.objectStore(name));
    tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}
const kvGet = k => store('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => store('kv', 'readwrite', s => s.put(v, k));
const kvDel = k => store('kv', 'readwrite', s => s.delete(k));

/* ---------- Zustand ---------- */
const S = {
  data: emptyData(), tab: ({ todos: 1, notes: 1, media: 1, sky: 1 })[localStorage.getItem('kn-tab')] ? localStorage.getItem('kn-tab') : 'todos',
  key: null, token: null, cfg: null, meta: null, sha: null,
  rev: 0, sync: 'idle', lastSync: 0, search: '', selecting: false, picked: new Set(),
  modal: null, noteId: null, viewId: null, uploads: [], doneOpen: {}, pendingRender: false,
};
function emptyData() { return { v: 1, todos: [], notes: [], media: [], settings: { mediaTTL: 0, updatedAt: 0 } }; }

/* ---------- GitHub ---------- */
async function gh(path, opts = {}) {
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}${path}`, {
      method: opts.method || 'GET', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + S.token, Accept: opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) { const err = new Error('Keine Verbindung'); err.status = 0; throw err; }
  return r;
}
async function ghFail(r) {
  let m = ''; try { m = (await r.json()).message || ''; } catch { }
  const e = new Error(m || ('HTTP ' + r.status)); e.status = r.status; throw e;
}
async function ghJson(path, opts) { const r = await gh(path, opts); if (!r.ok) await ghFail(r); return r.status === 204 ? null : r.json(); }
async function getFile(path) {
  const r = await gh('/contents/' + path);
  if (r.status === 404) return null;
  if (!r.ok) await ghFail(r);
  const j = await r.json();
  if (j.content && j.encoding === 'base64') return { sha: j.sha, bytes: unb64(j.content) };
  const raw = await gh('/contents/' + path, { accept: 'application/vnd.github.raw+json' });
  if (!raw.ok) await ghFail(raw);
  return { sha: j.sha, bytes: new Uint8Array(await raw.arrayBuffer()) };
}
async function getRaw(path) {
  const r = await gh('/contents/' + path, { accept: 'application/vnd.github.raw+json' });
  if (!r.ok) await ghFail(r);
  return new Uint8Array(await r.arrayBuffer());
}
async function putFile(path, bytes, sha, message) {
  const j = await ghJson('/contents/' + path, { method: 'PUT', body: { message, content: b64(bytes), ...(sha ? { sha } : {}) } });
  return j.content.sha;
}
async function delFile(path) {
  const r = await gh('/contents/' + path);
  if (r.status === 404) return;
  if (!r.ok) await ghFail(r);
  const { sha } = await r.json();
  const d = await gh('/contents/' + path, { method: 'DELETE', body: { message: 'Datei gelöscht', sha } });
  if (!d.ok && d.status !== 404) await ghFail(d);
}
// Alle Schreibzugriffe nacheinander, sonst gibt es Konflikte auf dem Branch
let _q = Promise.resolve();
function queued(fn) { const p = _q.then(fn, fn); _q = p.catch(() => { }); return p; }

/* ---------- Sync ---------- */
function mergeList(a = [], b = []) {
  const m = new Map(); for (const x of a) m.set(x.id, x);
  for (const y of b) { const x = m.get(y.id); if (!x || (y.updatedAt || 0) > (x.updatedAt || 0)) m.set(y.id, y); }
  return [...m.values()];
}
const mergeSet = (a = {}, b = {}) => ((b.updatedAt || 0) > (a.updatedAt || 0) ? b : a);
const merge = (a, b) => ({ v: 1, todos: mergeList(a.todos, b.todos), notes: mergeList(a.notes, b.notes), media: mergeList(a.media, b.media), settings: { mediaTTL: 0, updatedAt: 0, ...mergeSet(a.settings, b.settings) } });
function sameAs(a, b) {
  if (((a.settings || {}).updatedAt || 0) !== ((b.settings || {}).updatedAt || 0)) return false;
  for (const k of ['todos', 'notes', 'media']) {
    const A = a[k] || [], B = new Map((b[k] || []).map(x => [x.id, x.updatedAt]));
    if (A.length !== B.size) return false;
    for (const x of A) if (B.get(x.id) !== x.updatedAt) return false;
  }
  return true;
}
function purge() { const lim = Date.now() - 30 * DAY; for (const k of ['todos', 'notes', 'media']) S.data[k] = S.data[k].filter(x => !(x.deleted && x.updatedAt < lim)); }
function dailyCleanup() {
  // Erledigte "Heute"-Aufgaben von gestern verschwinden am nächsten Tag
  const d0 = startOfDay(); let ch = false;
  for (const t of S.data.todos) if (!t.deleted && t.list === 'today' && t.done && (t.doneAt || t.updatedAt) < d0) { t.deleted = true; t.updatedAt = Date.now(); ch = true; }
  if (ch) touch();
}
async function readRemote() {
  const f = await getFile('data.enc');
  if (!f) return null;
  return { sha: f.sha, data: JSON.parse(dec.decode(await decBytes(S.key, f.bytes))) };
}
function setSync(s, msg) {
  S.sync = s; const b = $('#syncBtn'); if (!b) return;
  b.dataset.s = s;
  $('#syncTxt').textContent = { idle: '…', ok: 'synchron', busy: 'synchronisiere', pending: 'speichere', offline: 'offline', err: 'Fehler' }[s] || s;
  b.title = msg || 'Jetzt synchronisieren';
}
async function sync() {
  if (!S.key) return;
  setSync('busy');
  try {
    const r = await readRemote();
    if (r) {
      S.sha = r.sha; S.data = merge(S.data, r.data);
      if (!sameAs(S.data, r.data)) schedulePush(200);
      else setSync('ok');
    } else {
      S.sha = null;
      if (S.data.todos.length || S.data.notes.length || S.data.media.length) schedulePush(200); else setSync('ok');
    }

}
let _pushT;
function schedulePush(ms = 900) { clearTimeout(_pushT); _pushT = setTimeout(push, ms); setSync('pending'); }
function touch() { S.rev++; saveCache(); schedulePush(); }
function push() {
  return queued(async () => {
    const rev = S.rev;
    for (let i = 0; i < 4; i++) {
      try {
        purge();
        const bytes = await encBytes(S.key, enc.encode(JSON.stringify(S.data)));
        S.sha = await putFile('data.enc', bytes, S.sha, 'Sync');
        S.lastSync = Date.now(); saveCache();
        if (S.rev !== rev) schedulePush(600); else setSync('ok');
        return;
      } catch (e) {
        if (e.status === 409 || e.status === 422) {
          const r = await readRemote().catch(() => null);
          if (r) { S.data = merge(S.data, r.data); S.sha = r.sha; } else S.sha = null;
          safeRender(); continue;
        }
        syncError(e); return;
      }

}
function syncError(e) {
  if (e.status === 0 || !navigator.onLine) return setSync('offline', 'Offline – Änderungen werden später übertragen');
  if (e.status === 401) { setSync('err', 'Token ungültig oder abgelaufen'); toast('GitHub-Token ungültig oder abgelaufen – bitte in den Einstellungen erneuern.'); return; }
  if (e.status === 403 || e.status === 404) { setSync('err', 'Kein Zugriff auf das Daten-Repo'); toast('Kein Zugriff auf das Daten-Repo (Token-Rechte prüfen).'); return; }
  setSync('err', e.message);
}
let _cacheT;
function saveCache() {
  clearTimeout(_cacheT);
  _cacheT = setTimeout(async () => { try { await kvSet('cache', await encBytes(S.key, enc.encode(JSON.stringify(S.data)))); } catch { } }, 300);
}
async function loadCache() {
  try { const c = await kvGet('cache'); if (c) S.data = merge(emptyData(), JSON.parse(dec.decode(await decBytes(S.key, c)))); } catch { }
}

/* ---------- Toast ---------- */
let _toastT;
function toast(msg, label, fn, ms = 4500) {
  const t = $('#toast'), b = $('#toastBtn');
  $('#toastTxt').textContent = msg;
  b.hidden = !label; b.textContent = label || '';
  b.onclick = () => { t.classList.remove('on'); fn && fn(); };
  t.classList.add('on'); clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), ms);
}

/* =====================================================================

  $('#gateForm').onsubmit = e => { e.preventDefault(); mode === 'unlock' ? doUnlock(e.target) : doSetup(e.target); };
  const rb = $('#resetBtn'); if (rb) rb.onclick = () => renderGate('setup');
}
function gateBusy(on, txt) { const b = $('#gateBtn'); b.disabled = on; b.style.opacity = on ? .6 : 1; if (txt) b.innerHTML = txt; if (!on) $('#gateErr').textContent = ''; }
async function doSetup(f) {
  const err = m => { gateBusy(false, $('#pass2Wrap').hidden ? 'Verbinden' : 'Notizbuch anlegen'); $('#gateErr').textContent = m; };
  const owner = f.owner.value.trim(), repo = f.repo.value.trim(), token = f.token.value.trim(), pass = f.pass.value;
  if (pass.length < 8) return err('Die Passphrase sollte mindestens 8 Zeichen haben.');
  gateBusy(true, '<span class="spin"></span> Verbinde …');
  S.cfg = { owner, repo }; S.token = token;
  try {
    const r = await gh('/contents/meta.json');
    let meta, key;
    if (r.status === 401) return err('Token ungültig.');
    if (r.status === 404) {
      const rr = await gh('');
      if (!rr.ok) return err(rr.status === 404 ? 'Repo nicht gefunden – oder der Token hat keinen Zugriff darauf.' : 'Kein Zugriff (HTTP ' + rr.status + ').');
      const rj = await rr.json();
      if (!rj.private) return err('Das Daten-Repo ist öffentlich. Bitte ein privates Repo verwenden.');
      const w = $('#pass2Wrap');
      if (w.hidden) { w.hidden = false; const i = $('#gateInfo'); i.hidden = false; i.textContent = 'Neues Notizbuch – bitte Passphrase wiederholen.'; f.pass2.focus(); return gateBusy(false, 'Notizbuch anlegen'); }
      if (f.pass2.value !== pass) return err('Die Passphrasen stimmen nicht überein.');
      meta = { app: 'kosmos-notes', v: 1, iter: 310000, salt: b64(crypto.getRandomValues(new Uint8Array(16))) };
      key = await deriveKey(pass, meta.salt, meta.iter);
      meta.check = await encStr(key, 'kosmos-ok');
      await putFile('meta.json', enc.encode(JSON.stringify(meta, null, 2)), null, 'Notizbuch angelegt');
    } else if (r.ok) {
      meta = JSON.parse(dec.decode(unb64((await r.json()).content)));
      key = await deriveKey(pass, meta.salt, meta.iter);
      try { if (await decStr(key, meta.check) !== 'kosmos-ok') throw 0; } catch { return err('Passphrase falsch.'); }
    } else return err('Kein Zugriff (HTTP ' + r.status + ').');
    S.key = key; S.meta = meta;
    await kvSet('cfg', S.cfg); await kvSet('meta', meta); await kvSet('key', key); await kvSet('tok', await encStr(key, token));
    enterApp();
  } catch (e) { err(e.status === 0 ? 'Keine Internetverbindung.' : e.message); }
}
async function doUnlock(f) {
  gateBusy(true, '<span class="spin"></span> Entsperre …');
  try {
    const key = await deriveKey(f.pass.value, S.meta.salt, S.meta.iter);
    try { await decStr(key, S.meta.check); } catch { gateBusy(false, I.lock + ' Entsperren'); $('#gateErr').textContent = 'Passphrase falsch.'; return; }
    S.key = key; S.token = await decStr(key, await kvGet('tok'));
    await kvSet('key', key); enterApp();
  } catch (e) { gateBusy(false, I.lock + ' Entsperren'); $('#gateErr').textContent = e.message; }
}

function repLabel(r) {

  if (r.type === 'weekdays') return 'werktags';
  if (r.type === 'weekly') return (r.days || []).length === 7 ? 'täglich' : 'jeden ' + [1, 2, 3, 4, 5, 6, 0].filter(d => (r.days || []).includes(d)).map(d => WD[d]).join(', ');
  if (r.type === 'biweekly') return 'alle 2 Wochen';
  if (r.type === 'monthly') return 'monatlich am ' + r.day + '.';
  return '';
}
function monthDay(y, m, day) { const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)).getTime(); }
// erster Fälligkeitstag NACH "from" (Tagesbeginn)
function nextDue(r, from) {

  if (r.type === 'monthly') {
    const d = new Date(from); let c = monthDay(d.getFullYear(), d.getMonth(), r.day);
    if (c <= from) c = monthDay(d.getFullYear(), d.getMonth() + 1, r.day);
    return c;

  for (let i = 1; i <= 7; i++) {
    const t = addDays(from, i), wd = new Date(t).getDay();
    if (r.type === 'daily' || (r.type === 'weekdays' && wd > 0 && wd < 6) || (r.type === 'weekly' && (r.days || []).includes(wd))) return t;
  }

}

async function squashHistory() {
  if (!confirm('Verlauf des Daten-Repos jetzt bereinigen? Der aktuelle Stand bleibt erhalten, ältere Versionen werden verworfen.')) return;
  toast('Bereinige Verlauf …');
  try {
    await push();
    await queued(async () => {
      const repo = await ghJson(''), br = repo.default_branch;
      const ref = await ghJson('/git/ref/heads/' + br);
      const c = await ghJson('/git/commits/' + ref.object.sha);
      const nc = await ghJson('/git/commits', { method: 'POST', body: { message: 'Verlauf bereinigt', tree: c.tree.sha, parents: [] } });
      await ghJson('/git/refs/heads/' + br, { method: 'PATCH', body: { sha: nc.sha, force: true } });
    });
    toast('Verlauf bereinigt ✓');
  } catch (e) { toast('Bereinigen fehlgeschlagen: ' + e.message); }
}

    case 'vk': S.vd.kind = b.dataset.k; renderVEntry(); break;
    case 'vf-eye': { const i = ov.querySelector('[data-f=secret]'); i.type = i.type === 'password' ? 'text' : 'password'; b.innerHTML = i.type === 'password' ? I.eye : I.eyeOff; break; }
    case 'vf-gen': { const pw = genPassword(20), i = ov.querySelector('[data-f=secret]'); i.value = pw; i.type = 'text'; S.vd.secret = pw; ov.querySelector('[data-act=vf-eye]').innerHTML = I.eyeOff; break; }
    case 'vf-save': saveVEntry(); break;
    case 'vf-del': {
      const e = V.data.entries.find(x => x.id === S.vd.id); if (!e) return;
      e.deleted = true; e.updatedAt = Date.now(); vaultTouch(); closeModal();
      toast('Eintrag gelöscht', 'Rückgängig', () => { if (!V.key) return; e.deleted = false; e.updatedAt = Date.now(); vaultTouch(); renderVault(); }); break;
    }
    case 'v-next': stepMedia(1); break;
    case 'v-share': m && shareMedia(m); break;
    case 'v-dl': m && downloadMedia(m); break;
    case 'v-del': if (m) { const list = mediaList(), i = list.findIndex(x => x.id === m.id), nx = list[i + 1] || list[i - 1]; deleteMedia([m.id]); nx ? openMedia(nx.id) : closeModal(); } break;
    case 'sync-now': sync(); toast('Synchronisiere …'); break;
    case 'squash': squashHistory(); break;
    case 'backup': backup(); break;
    case 'lock': kvDel('key').then(() => location.reload()); break;
    case 'new-token': {
      const t = prompt('Neuen GitHub-Token einfügen:'); if (!t) return;
      S.token = t.trim(); encStr(S.key, S.token).then(v => kvSet('tok', v)).then(() => { toast('Token gespeichert'); sync(); }); break;
    }
    case 'logout': if (confirm('Auf diesem Gerät abmelden? Die Daten bleiben im Repo, aber Token und Passphrase müssen neu eingegeben werden.')) { Promise.all(['key', 'tok', 'cache', 'meta', 'cfg'].map(kvDel)).then(() => location.reload()); } break;
  }
});
let _linkT;
ov.addEventListener('input', e => {
  if (S.modal === 'ventry' && e.target.dataset.f) { S.vd[e.target.dataset.f] = e.target.value; return; }
  if (e.target.id === 'repDay') { S.rep.day = e.target.value; $('#repNext').textContent = repNextTxt(); return; }
  const n = curNote(); if (!n) return;
  const el = e.target;
  if (el.classList.contains('cl-txt')) { n.items[+el.closest('.cli').dataset.i].text = el.value; noteChanged(n); return; }
  if (el.classList.contains('ed-title')) { n.title = el.value; noteChanged(n); }
  else if (el.classList.contains('ed-body')) { n.body = el.value; noteChanged(n); clearTimeout(_linkT); _linkT = setTimeout(() => { const l = $('#edLinks'); if (l) l.innerHTML = linksHTML(n.body); }, 400); }
  else if (el.classList.contains('pname')) { n.players[+el.closest('.player').dataset.i].name = el.value; noteChanged(n); }
  else if (el.classList.contains('pscore')) { n.players[+el.closest('.player').dataset.i].score = parseInt(el.value, 10) || 0; noteChanged(n); }
});
ov.addEventListener('keydown', e => {
  const el = e.target;
  if (el.classList.contains('ed-title') && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const nx = $('.cl-txt') || $('.pname') || $('.ed-body'); nx && nx.focus(); return; }
  if (!el.classList.contains('cl-txt')) return;
  const n = curNote(), i = +el.closest('.cli').dataset.i;
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); clAdd(n, i + 1); }
  else if (e.key === 'Backspace' && !el.value && n.items.length > 1) { e.preventDefault(); n.items.splice(i, 1); clRefresh(n, i - 1); }
});
ov.addEventListener('change', e => { if (e.target.classList.contains('pscore')) $('#scoreBox').innerHTML = scoreHTML(curNote()); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { e.preventDefault(); closeModal(); }
  if (S.modal === 'quick' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveQuick(); }
  const t = e.target, typing = t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable;
  if (!S.modal && !typing && !$('#app').hidden && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openQuick(); }
  if (S.modal === 'viewer' && e.key === 'ArrowLeft') stepMedia(-1);
  if (S.modal === 'viewer' && e.key === 'ArrowRight') stepMedia(1);
});
document.addEventListener('paste', e => {
  if ($('#app').hidden) return;
  const t = e.target, inText = t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable;
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length || inText) return;
  e.preventDefault();
  const stamp = new Date().toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/[.:,\s]+/g, '-');
  uploadFiles(files.map((f, i) => (f.name && f.name !== 'image.png') ? f : new File([f], `Eingefügt-${stamp}${i ? '-' + i : ''}.${(f.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: f.type })));
});
// Ganzes Fenster als Ablage, wenn der Frachtraum offen ist
document.addEventListener('dragover', e => { if (S.tab === 'media' && e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { if (S.tab === 'media' && e.dataTransfer?.files?.length && !e.target.closest('#drop')) { e.preventDefault(); uploadFiles([...e.dataTransfer.files]); } });

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.key && Date.now() - S.lastSync > 8000) sync(); });
window.addEventListener('online', () => S.key && sync());
setInterval(() => { if (!document.hidden && S.key && S.sync !== 'busy' && Date.now() - S.lastSync > 60000) sync(); }, 15000);

/* =====================================================================
   Sternenhimmel
   ===================================================================== */
(function sky() {
  const c = $('#sky'), x = c.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, stars = [], shoot = null, running = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(w * h / 5200) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() ** 3 * 1.5 + .25, a: Math.random() * .7 + .2,
      t: Math.random() * 6.28, s: Math.random() * .025 + .004, z: Math.random() * .6 + .15,
      c: Math.random() < .18 ? (Math.random() < .5 ? '190,210,255' : '255,222,180') : '255,255,255'
    }));
    if (reduce) frame();
  }
  function frame() {
    x.clearRect(0, 0, w, h);
    for (const s of stars) {
      if (!reduce) { s.t += s.s; s.x -= s.z * .035; if (s.x < -2) s.x = w + 2; }
      const a = s.a * (.6 + .4 * Math.sin(s.t));
      x.fillStyle = `rgba(${s.c},${a})`; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill();
      if (s.r > 1.35) { x.fillStyle = `rgba(${s.c},${a * .12})`; x.beginPath(); x.arc(s.x, s.y, s.r * 4, 0, 6.283); x.fill(); }
    }
    if (!reduce) {
      if (!shoot && Math.random() < .0012) shoot = { x: Math.random() * w * .8 + w * .2, y: Math.random() * h * .4, vx: -(7 + Math.random() * 5), vy: 2.5 + Math.random() * 2, l: 1 };
      if (shoot) {
        const g = x.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 12, shoot.y - shoot.vy * 12);
        g.addColorStop(0, `rgba(255,255,255,${shoot.l})`); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.strokeStyle = g; x.lineWidth = 1.4; x.beginPath(); x.moveTo(shoot.x, shoot.y); x.lineTo(shoot.x - shoot.vx * 12, shoot.y - shoot.vy * 12); x.stroke();
        shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.l -= .018; if (shoot.l <= 0) shoot = null;
      }
    }
  }
  function loop() { if (document.hidden) { running = false; return; } frame(); requestAnimationFrame(loop); }
  function start() { if (!reduce && !running) { running = true; requestAnimationFrame(loop); } }
  addEventListener('resize', resize); document.addEventListener('visibilitychange', start);
  resize(); start();
})();

/* =====================================================================
   Start
   ===================================================================== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
(async function init() {
  try {
    S.cfg = await kvGet('cfg'); S.meta = await kvGet('meta'); S.key = await kvGet('key');
    const tok = await kvGet('tok');
    if (!S.cfg || !S.meta || !tok) return renderGate('setup');
    if (!S.key) return renderGate('unlock');
    try { S.token = await decStr(S.key, tok); } catch { await kvDel('key'); S.key = null; return renderGate('unlock'); }
    enterApp();
  } catch (e) { renderGate('setup', 'Lokaler Speicher nicht verfügbar (privates Fenster?): ' + e.message); }
})();
</script>
